name: CI

on:
  push:
    branches:
      - master

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }} / ${{ matrix.gemfile }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '2.5'
          - '2.6'
          - '2.7'
          - '3.0'
          - '3.1'
          - '3.2'
          - '3.3'
          - '3.4'
        gemfile:
          - rails_5.0
          - rails_5.1
          - rails_5.2
          - rails_6.0
          - rails_6.1
          - rails_7.0
          - rails_7.1
          - rails_7.2
          - rails_8.0
          - mongoid_5.0
          - mongoid_6.0
          - mongoid_7.0
          - mongoid_7.1
        exclude:
          - ruby: '2.5'
            gemfile: rails_7.0
          - ruby: '2.5'
            gemfile: rails_7.1
          - ruby: '2.5'
            gemfile: rails_7.2
          - ruby: '2.5'
            gemfile: rails_8.0
          - ruby: '2.6'
            gemfile: rails_7.0
          - ruby: '2.6'
            gemfile: rails_7.1
          - ruby: '2.6'
            gemfile: rails_7.2
          - ruby: '2.6'
            gemfile: rails_8.0
          - ruby: '2.7'
            gemfile: rails_7.2
          - ruby: '2.7'
            gemfile: rails_8.0
          - ruby: '3.0'
            gemfile: rails_5.0
          - ruby: '3.0'
            gemfile: rails_5.1
          - ruby: '3.0'
            gemfile: rails_5.2
          - ruby: '3.0'
            gemfile: rails_7.2
          - ruby: '3.0'
            gemfile: rails_8.0
          - ruby: '3.0'
            gemfile: mongoid_5.0
          - ruby: '3.0'
            gemfile: mongoid_6.0
          - ruby: '3.1'
            gemfile: rails_5.0
          - ruby: '3.1'
            gemfile: rails_5.1
          - ruby: '3.1'
            gemfile: rails_5.2
          - ruby: '3.1'
            gemfile: rails_7.2
          - ruby: '3.1'
            gemfile: rails_8.0
          - ruby: '3.1'
            gemfile: mongoid_5.0
          - ruby: '3.1'
            gemfile: mongoid_6.0
          - ruby: '3.2'
            gemfile: rails_5.0
          - ruby: '3.2'
            gemfile: rails_5.1
          - ruby: '3.2'
            gemfile: rails_5.2
          - ruby: '3.2'
            gemfile: mongoid_5.0
          - ruby: '3.2'
            gemfile: mongoid_6.0
          - ruby: '3.3'
            gemfile: rails_5.0
          - ruby: '3.3'
            gemfile: rails_5.1
          - ruby: '3.3'
            gemfile: rails_5.2
          - ruby: '3.3'
            gemfile: mongoid_5.0
          - ruby: '3.3'
            gemfile: mongoid_6.0
          - ruby: '3.4'
            gemfile: rails_5.0
          - ruby: '3.4'
            gemfile: rails_5.1
          - ruby: '3.4'
            gemfile: rails_5.2
          - ruby: '3.4'
            gemfile: mongoid_5.0
          - ruby: '3.4'
            gemfile: mongoid_6.0
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.gemfile }}.gemfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run tests
        run: bundle exec rake spec
